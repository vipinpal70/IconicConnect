# Production data services: PostgreSQL 16 + Redis 7 (+ Adminer, opt-in).
#
# SECURITY MODEL (read this before changing ports):
#   * Every published port is bound to 127.0.0.1 — NOTHING here is reachable from the internet. Docker writes its
#     own iptables rules that BYPASS ufw, so "ufw deny 5432" would NOT protect a port published on 0.0.0.0.
#     Binding to loopback is the only reliable fix.
#   * The app (PM2 on the same host) connects via 127.0.0.1. Humans reach the database through an SSH tunnel.
#   * Secrets are FILES (./secrets/postgres_password, ./redis.conf — generated by render-secrets.sh, mode 400/600,
#     never in git). Nothing secret appears in `docker inspect`, `ps`, or this file.
name: iconic

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}   # pin by digest in .env for fully reproducible deploys
    container_name: iconic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iconic}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-iconic_connect}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums"
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=100
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - log_min_duration_statement=500     # log queries slower than 500 ms
      - -c
      - log_connections=off
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]   # what the official entrypoint needs; nothing more
    pids_limit: 300
    mem_limit: ${PG_MEM_LIMIT:-1536m}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: iconic_redis
    restart: unless-stopped
    # All settings (password, AOF persistence, noeviction, renamed dangerous commands) live in ./redis.conf,
    # which render-secrets.sh generates root-owned and mode 400 — so the password is never on a command line.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      # REDISCLI_AUTH (env, not -a) keeps the password out of the process list.
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(sed -n 's/^requirepass //p' /usr/local/etc/redis/redis.conf) redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 100
    mem_limit: ${REDIS_MEM_LIMIT:-640m}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Database UI — NOT started by default. Start only when needed:  docker compose --profile tools up -d adminer
  # Listens on loopback; open it through an SSH tunnel (see deploy/README.md), then stop it again.
  adminer:
    image: ${ADMINER_IMAGE:-adminer:4}
    container_name: iconic_adminer
    profiles: ["tools"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  pgdata:
  redisdata:
