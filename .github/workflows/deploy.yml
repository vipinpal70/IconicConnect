name: Deploy to VPS

# NOTE: this runs the APP deploy only (PM2 + nginx). The data services (Docker/Postgres/Redis) are provisioned by
# provision-infra.yml. Before pointing this at the no-supabase branch, make sure that workflow has run once.

on:
  push:
    branches:
      # - main
      # - master
      - phase2-designOnly

permissions:
  contents: read

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy via SSH
        # Pinned to a commit (not @master): this action receives the server's SSH key, so it must not change under us.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # Pins the server's host key (SHA256:...) so a man-in-the-middle cannot impersonate the VPS. Required secret.
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          envs: GITHUB_REF_NAME
          script: |
            # Exit on error
            set -e

            # Load NVM and Node
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Ensure we have a node version loaded
            if ! command -v node &> /dev/null; then
              # Try to use default alias if nvm is present
              nvm use default || nvm use node || echo "Node not found via NVM"
            fi

            # Navigate to the project directory
            TARGET_DIR="/home/ubuntu/iconicconnect"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Creating target directory..."
              mkdir -p "$TARGET_DIR"
            fi
            
            cd "$TARGET_DIR"

            # Load application environment for migrations/build/runtime commands
            if [ -f "$TARGET_DIR/.env" ]; then
              echo "Loading environment from .env..."
              set -a
              . "$TARGET_DIR/.env"
              set +a
            else
              echo "Warning: $TARGET_DIR/.env not found"
            fi
            
            # Check if directory is a git repository
            if [ ! -d ".git" ]; then
              echo "Initializing repository from branch $GITHUB_REF_NAME..."
              git clone -b "$GITHUB_REF_NAME" https://github.com/${{ github.repository }}.git .
            else
              echo "Updating from branch $GITHUB_REF_NAME..."
              git fetch origin "$GITHUB_REF_NAME"
              git reset --hard "origin/$GITHUB_REF_NAME"
            fi

            # Ensure case_data directory exists and has correct permissions for local uploads
            echo "Setting up case_data directory and permissions..."
            mkdir -p "$TARGET_DIR/case_data"
            chmod -R 777 "$TARGET_DIR/case_data"

            # Remove existing build and modules
            echo "Cleaning old build and modules..."
            rm -rf node_modules .next
            
            # Install dependencies
            echo "Installing dependencies..."
            npm install --include=dev

            # Apply the committed dbmate migrations (db/migrations/*.sql). Needs DATABASE_URL, loaded from .env above.
            # (The old Drizzle migrator `db:migrate` is retired: it would build the legacy schema.)
            echo "Running database migrations..."
            npm run db:deploy
            
            # Ensure tsx and pm2 are installed
            echo "Installing global dependencies..."
            npm install -g tsx pm2
            
            # Add npm global bin to PATH
            export PATH=$PATH:$(npm config get prefix)/bin

            # Build the Next.js application
            echo "Building application..."
            npm run build
            
            # --- Infrastructure Setup ---
            echo "Setting up Firewall, Nginx and SSL..."
            
            # Configure Firewall
            # sudo ufw allow 'Nginx Full' || (sudo ufw allow 80/tcp && sudo ufw allow 443/tcp)
            # sudo ufw allow 4000/tcp
            

            # Install Nginx and Certbot if they don't exist
            # sudo apt-get update -y || true
            # sudo apt-get install -y nginx certbot python3-certbot-nginx
            
            # Copy Nginx config from repo
            # sudo cp "$TARGET_DIR/nginx/connect.fynback.com" /etc/nginx/sites-available/connect.fynback.com
            
            # Enable the site
            # sudo ln -sf /etc/nginx/sites-available/connect.fynback.com /etc/nginx/sites-enabled/
            
            # Remove default site if it exists to prevent conflicts
            # sudo rm -f /etc/nginx/sites-enabled/default
            
            # Test Nginx config and reload
            # sudo nginx -t
            sudo systemctl reload nginx
            
            # Issue SSL Certificate (non-interactive)
            # This will automatically modify the Nginx config to add HTTPS
            # sudo certbot --nginx -d connect.fynback.com --non-interactive --agree-tos -m admin@fynback.com --redirect || echo "Certbot already configured or failed."

            # Start or restart services using PM2 ecosystem config
            echo "Starting/Restarting PM2 processes..."
            pm2 start ecosystem.config.js || pm2 restart ecosystem.config.js
            
            # Save PM2 state
            pm2 save
